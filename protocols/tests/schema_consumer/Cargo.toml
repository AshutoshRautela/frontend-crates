[package]
name = "protocol-schema-consumer"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately outside the parent workspace: exercise a downstream consumer's
# dependency/feature resolution rather than workspace-wide feature unification.
[workspace]

[dependencies]
dynamo-protocols = { path = "../..", features = ["protocol-schema"] }
serde_json = "1"
utoipa = "5.5.0"
