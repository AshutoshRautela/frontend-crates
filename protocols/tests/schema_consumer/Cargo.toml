[package]
name = "protocol-schema-consumer"
version = "0.0.0"
edition = "2024"
publish = false

# Build separately so other workspace crates cannot enable missing dependency
# features on this consumer's behalf.
[workspace]

[dependencies]
dynamo-protocols = { path = "../..", features = ["protocol-schema"] }
serde_json = "1"
utoipa = "5.5.0"
